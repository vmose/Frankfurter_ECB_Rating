version: 2

models:
  - name: stg_currency_rates
    description: Cleaned, typed view over the raw Frankfurter currency rates.
    columns:
      - name: rate_date
        tests:
          - not_null
      - name: base_currency
        tests:
          - not_null
      - name: quote_currency
        tests:
          - not_null
      - name: rate
        tests:
          - not_null
      - name: source_name
        tests:
          - not_null
          - accepted_values:
              values: ['frankfurter_ecb']

    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - rate_date
            - base_currency
            - quote_currency
            - source_name
